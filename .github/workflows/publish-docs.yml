name: Publish Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source:
        description: "Tag or branch to publish to docs branch"
        required: true

jobs:
  publish-docs:
    name: Publish Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish to docs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event_name }}" = "release" ]; then
            SOURCE="${GITHUB_REF#refs/tags/}"
          else
            SOURCE="${{ github.event.inputs.source }}"
          fi

          SOURCE_SHA=$(git rev-parse $SOURCE)

          # Build the docs snapshot WITHOUT .github: GITHUB_TOKEN is not
          # allowed to push workflow file changes, and the docs branch
          # (Mintlify source) does not need CI configuration anyway.
          TMP=$(mktemp -d)
          git archive "$SOURCE_SHA" | tar -x -C "$TMP"
          rm -rf "$TMP/.github"
          git -C "$TMP" init -q
          git -C "$TMP" add -A
          git -C "$TMP" -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -qm "docs snapshot of $SOURCE ($SOURCE_SHA)"
          git -C "$TMP" push -f https://github-actions[bot]:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:refs/heads/docs
